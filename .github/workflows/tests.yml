name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Source (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt stim
      - run: ./scripts/python.sh scripts/build_native_core.py
      - run: ./scripts/python.sh scripts/project_checks.py --suite current
  wheel:
    name: Installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build and install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl ./tests/fixtures/basic/decoder_plugin
      - name: Run the installed-wheel tests
        env:
          MAGNA_INSTALLED_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: ./scripts/python.sh -m unittest discover -s tests/core -p test_installed_interface.py -v
  passed:
    name: Tests passed
    if: always()
    needs: [source, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every test job succeeded
        run: |
          test "${{ needs.source.result }}" = success
          test "${{ needs.wheel.result }}" = success
